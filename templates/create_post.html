<!DOCTYPE html>
<html>
<head>
  <title>Create Post</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/create_post.css') }}">
</head>

<body>
  <div class="page">

    <!-- TOP BAR -->
    <div class="topbar">
      <button type="button" class="icon-btn" onclick="goBack()">✕</button>
      <span class="topbar-title">Create Post</span>
      <button type="button" class="post-btn" onclick="submitPost()">Post</button>
    </div>

    <!-- MAIN FORM -->
    <form id="postForm" enctype="multipart/form-data">

      <!-- IMAGE UPLOAD AREA -->
      <input type="file" id="imageInput" name="image" accept="image/*" hidden onchange="handleImageSelect(event)">

      <!-- Upload placeholder (shown when no image selected) -->
      <label for="imageInput" class="upload-placeholder" id="uploadPlaceholder">
        <svg viewBox="0 0 24 24" class="upload-icon">
          <path d="M12 16V4"/>
          <path d="M7 9L12 4L17 9"/>
          <path d="M5 20H19"/>
        </svg>
        <span class="upload-title">Add Photo</span>
        <span class="upload-sub">Tap to choose an image</span>
      </label>

      <!-- Image preview — matches feed post style exactly -->
      <div class="preview-wrap" id="previewWrap">
        <img id="previewImg" src="" alt="Preview">
        <button type="button" class="change-btn" onclick="document.getElementById('imageInput').click()">
          Change Photo
        </button>
      </div>

      <!-- FIT SELECTOR (shown after image selected) -->
      <div class="fit-row" id="fitRow">
        <button type="button" class="fit-btn active" onclick="setFit('cover', this)">Cover</button>
        <button type="button" class="fit-btn" onclick="setFit('contain', this)">Full Image</button>
      </div>
      <input type="hidden" id="fitType" name="fit_type" value="cover">

      <!-- CAPTION -->
      <textarea name="caption" id="caption" placeholder="Write a caption..." rows="3"></textarea>

      <!-- FILTERS PLACEHOLDER -->
      <div class="coming-soon">🎨 Filters — Coming Soon</div>

    </form>

  </div>

  <!-- POST LOADER (fullscreen overlay) -->
  <div id="postLoader" class="post-loader">
    <div class="loader-box">
      <div class="loader-icon">⬆</div>
      <h3 id="loaderTitle">Creating Post</h3>
      <p id="loaderText">Uploading your image...</p>
      <div class="progress-track">
        <div class="progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    // ─── STATE ───────────────────────────────────────────
    let compressedImage = null;

    // ─── ELEMENTS ────────────────────────────────────────
    const uploadPlaceholder = document.getElementById("uploadPlaceholder");
    const previewWrap       = document.getElementById("previewWrap");
    const previewImg        = document.getElementById("previewImg");
    const fitRow            = document.getElementById("fitRow");
    const postLoader        = document.getElementById("postLoader");

    // ─── LOADER ──────────────────────────────────────────
    function showLoader(title, text) {
      document.getElementById("loaderTitle").textContent = title || "Creating Post";
      document.getElementById("loaderText").textContent  = text  || "Uploading your image...";
      postLoader.classList.add("show");
    }

    function hideLoader() {
      postLoader.classList.remove("show");
    }

    function updateLoader(title, text) {
      document.getElementById("loaderTitle").textContent = title;
      document.getElementById("loaderText").textContent  = text;
    }

    // ─── IMAGE HANDLING ───────────────────────────────────
    async function handleImageSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      compressedImage = await compressImage(file);

      previewImg.src = URL.createObjectURL(compressedImage);
      uploadPlaceholder.style.display = "none";
      previewWrap.style.display = "block";
      fitRow.style.display = "flex";

      console.log("Original:", (file.size / 1024 / 1024).toFixed(2), "MB");
      console.log("Compressed:", (compressedImage.size / 1024).toFixed(0), "KB");
    }

    async function compressImage(file) {
      return new Promise((resolve) => {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx    = canvas.getContext("2d");

          const maxWidth = 1080;
          let width  = img.width;
          let height = img.height;

          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width  = maxWidth;
          }

          canvas.width  = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);

          canvas.toBlob(
            (blob) => {
              resolve(new File([blob], file.name, { type: "image/jpeg" }));
            },
            "image/jpeg",
            0.7
          );
        };
      });
    }

    // ─── FIT TOGGLE ───────────────────────────────────────
    function setFit(type, btn) {
      document.querySelectorAll(".fit-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("fitType").value = type;

      if (type === "cover") {
        // Container has fixed height → image fills it edge-to-edge, no black bars
        previewWrap.classList.remove("contain-mode");
        previewImg.style.objectFit = "cover";
        previewImg.style.height    = "100%";
      } else {
        // Container height becomes auto → image shows at natural height
        previewWrap.classList.add("contain-mode");
        previewImg.style.objectFit = "contain";
        previewImg.style.height    = "auto";
      }
    }

    // ─── SUBMIT ───────────────────────────────────────────
    async function submitPost() {
      if (!compressedImage) {
        alert("Please select an image first.");
        return;
      }

      showLoader("Creating Post", "Uploading your image...");

      const formData = new FormData();
      formData.append("image",    compressedImage);
      formData.append("caption",  document.getElementById("caption").value);
      formData.append("fit_type", document.getElementById("fitType").value);

      try {
        const response = await fetch("/create-post", {
          method: "POST",
          body: formData,
          credentials: "same-origin"
        });

        const data = await response.json();

        if (data.redirect) {
          hideLoader();
          window.location.href = data.redirect;
          return;
        }

        if (data.success) {
          updateLoader("Post Created!", "Redirecting to feed...");
          setTimeout(() => {
            window.location.replace("/feed");
          }, 1200);
        } else {
          hideLoader();
          alert(data.message || "Upload failed. Please try again.");
        }

      } catch (err) {
        hideLoader();
        alert("Something went wrong. Please try again.");
        console.error(err);
      }
    }

    // ─── GO BACK (with confirmation) ──────────────────────
    function goBack() {
      if (compressedImage) {
        // They've selected an image — confirm before leaving
        const confirmed = confirm("Discard this post? Your changes will be lost.");
        if (!confirmed) return;
      }
      if (document.referrer) {
        history.back();
      } else {
        window.location.href = "/feed";
      }
    }
  </script>
</body>
</html>
